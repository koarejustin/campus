<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Vérification de bulletin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #17200F;
      background-image: radial-gradient(circle at 20% -10%, rgba(76,140,92,.18), transparent 55%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 440px; }
    .brand { text-align: center; margin-bottom: 26px; }
    .brand-logo {
      width: 58px; height: 58px; border-radius: 18px;
      background: linear-gradient(135deg,#4C8C5C,#1F4A2C);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 14px; overflow: hidden;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-logo svg { width: 26px; height: 26px; stroke: #fff; }
    .brand-nom { font-size: 1.5rem; font-weight: 900; color: #fff; letter-spacing: -.02em; }
    .brand-tag {
      font-size: .62rem; font-weight: 700; letter-spacing: .25em; text-transform: uppercase;
      color: rgba(255,255,255,.32); margin-top: 6px;
    }
    .card {
      position: relative;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px;
      padding: 30px 26px 26px;
      backdrop-filter: blur(20px);
      overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .card.ok::before { background: linear-gradient(90deg,#4C8C5C,#3E7A4E); }
    .card.warn::before { background: linear-gradient(90deg,#C9932A,#A9761E); }
    .card.err::before { background: linear-gradient(90deg,#A93226,#7C231A); }

    .state-icon {
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .state-icon.ok { background: rgba(76,140,92,.18); }
    .state-icon.warn { background: rgba(201,147,42,.18); }
    .state-icon.err { background: rgba(169,50,38,.18); }
    .state-icon svg { width: 28px; height: 28px; }
    .state-icon.ok svg { stroke: #6CB57D; }
    .state-icon.warn svg { stroke: #E0AC48; }
    .state-icon.err svg { stroke: #D98A75; }

    .state-title { text-align: center; font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .state-sub { text-align: center; font-size: .78rem; color: rgba(255,255,255,.45); font-weight: 600; margin-bottom: 22px; }

    .rows { display: flex; flex-direction: column; gap: 12px; }
    .row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.08);
      gap: 12px;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .row-label {
      font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em;
      color: rgba(255,255,255,.32); white-space: nowrap;
    }
    .row-val { font-size: .86rem; font-weight: 700; color: #fff; text-align: right; }
    .row-val.mono { font-family: 'JetBrains Mono', monospace; }

    .warn-box {
      margin-top: 18px; padding: 12px 14px; border-radius: 12px;
      background: rgba(201,147,42,.1); border: 1px solid rgba(201,147,42,.25);
      font-size: .74rem; font-weight: 600; color: #E0AC48; line-height: 1.5;
    }

    .loading { text-align: center; color: rgba(255,255,255,.4); font-size: .82rem; font-weight: 600; padding: 20px 0; }
    .foot {
      text-align: center; margin-top: 20px; font-size: .64rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .18em; color: rgba(255,255,255,.2);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-logo" id="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand-nom" id="brand-nom">Établissement</div>
      <div class="brand-tag">Vérification de bulletin</div>
    </div>

    <div class="card" id="card">
      <div class="loading">Vérification en cours…</div>
    </div>

    <div class="foot">Campus Numérique</div>
  </div>

  <script>
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    async function chargerBranding() {
      try {
        const r = await fetch('/api/admin/config-public');
        const d = await r.json();
        if (d.success && d.config) {
          document.getElementById('brand-nom').textContent = d.config.nom_etablissement || 'Établissement';
          if (d.config.logo_url) {
            document.getElementById('brand-logo').innerHTML = `<img src="${esc(d.config.logo_url)}" alt="Logo">`;
          }
        }
      } catch (e) { /* branding non bloquant */ }
    }

    function renderState(cls, iconPath, title, sub) {
      const card = document.getElementById('card');
      card.className = 'card ' + cls;
      card.innerHTML = `
        <div class="state-icon ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg></div>
        <div class="state-title">${title}</div>
        <div class="state-sub">${sub}</div>
      `;
      return card;
    }

    const ICONS = {
      ok: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      warn: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      err: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    };

    async function verifier() {
      chargerBranding();
      const params = new URLSearchParams(window.location.search);
      const code = (params.get('code') || '').trim();

      if (!code) {
        renderState('err', ICONS.err, 'Aucun code fourni',
          'Scanne le QR code imprimé sur le bulletin pour vérifier son authenticité.');
        return;
      }

      try {
        const r = await fetch('/api/admin/verifier-bulletin/' + encodeURIComponent(code));
        const d = await r.json();

        if (!d.success) {
          renderState('err', ICONS.err, 'Vérification impossible', esc(d.message || 'Erreur serveur — réessaie plus tard.'));
          return;
        }
        if (!d.trouve) {
          renderState('err', ICONS.err, 'Code non reconnu',
            'Ce code ne correspond à aucun bulletin signé. Le document est peut-être falsifié.');
          return;
        }

        const dateSign = d.date_signature ? new Date(d.date_signature).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' }) : '—';
        const cls = d.modifie ? 'warn' : 'ok';
        const card = renderState(
          cls,
          d.modifie ? ICONS.warn : ICONS.ok,
          d.modifie ? 'Bulletin signé — modifié depuis' : 'Bulletin authentique',
          d.modifie
            ? 'Les notes ont été corrigées après la signature officielle.'
            : `Signé électroniquement par ${esc(d.signataire)}`
        );

        const rowsHtml = `
          <div class="rows">
            <div class="row"><span class="row-label">Élève</span><span class="row-val">${esc(d.eleve)}</span></div>
            <div class="row"><span class="row-label">Matricule</span><span class="row-val mono">${esc(d.code_unique)}</span></div>
            <div class="row"><span class="row-label">Classe</span><span class="row-val">${esc(d.classe)}</span></div>
            <div class="row"><span class="row-label">Trimestre</span><span class="row-val">${esc(d.trimestre)}${d.trimestre == 1 ? 'er' : 'ème'} — ${esc(d.annee_scolaire)}</span></div>
            <div class="row"><span class="row-label">Moyenne signée</span><span class="row-val">${d.moyenne !== null ? esc(d.moyenne.toFixed(2)) + '/20' : '—'}</span></div>
            <div class="row"><span class="row-label">Décision</span><span class="row-val">${esc(d.decision || '—')}</span></div>
            <div class="row"><span class="row-label">Signé le</span><span class="row-val">${esc(dateSign)}</span></div>
          </div>
          ${d.modifie ? `<div class="warn-box">⚠ Attention : les notes de ce bulletin ont été modifiées après la signature officielle du ${esc(dateSign)}. La version imprimée peut ne plus correspondre aux données actuelles.</div>` : ''}
        `;
        card.insertAdjacentHTML('beforeend', rowsHtml);
      } catch (e) {
        renderState('err', ICONS.err, 'Erreur réseau', 'Impossible de contacter le serveur. Vérifie ta connexion et réessaie.');
      }
    }

    verifier();
  </script>
</body>
</html>
